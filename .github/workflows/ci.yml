name: Build & SEO Regression Check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify SEO & Prerender
        run: |
          grep -q "<h1" dist/index.html
          test -f dist/privacy-policy/index.html
          test -f dist/terms/index.html
          test -f dist/editorial-policy/index.html
          ! grep -rnE "physical physical|SEO Sitemap" dist/ --include="*.html"